    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23222b"/><stop offset="1" stop-color="#4a4a52"/></linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#sky)"/>

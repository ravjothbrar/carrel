    <g transform="translate(260 300) rotate(-10)"><ellipse cx="0" cy="0" rx="26" ry="52"/><circle cx="-18" cy="-66" r="8"/><circle cx="-4" cy="-72" r="8"/><circle cx="11" cy="-70" r="8"/><circle cx="24" cy="-62" r="8"/></g>
    <g transform="translate(370 225) rotate(-6)"><ellipse cx="0" cy="0" rx="26" ry="52"/><circle cx="-18" cy="-66" r="8"/><circle cx="-4" cy="-72" r="8"/><circle cx="11" cy="-70" r="8"/><circle cx="24" cy="-62" r="8"/></g>
